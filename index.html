<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI-Buddy</title>
<link rel="icon" href="/App-icoon.png">
<link rel="apple-touch-icon" href="/App-icoon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI-Buddy">
<style>
  :root {
    --bg: #111324;
    --ai-bubble: #E6E6E6;
    --ai-text: #1b1d2e;
    --me-bubble: #212652;
    --me-text: #eef0ff;
    --accent: #FB2F74;
    --track: #2a2d44;
    --label: #6b6f8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    position: fixed;
    width: 100%;
  }
  #app {
    max-width: 430px;
    margin: 0 auto;
    height: 100%;
    height: 100dvh;
    background: linear-gradient(180deg, #111324 0%, #0A0B16 100%);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---------- Header ---------- */
  header {
    flex: 0 0 auto;
    padding: 14px 18px 10px;
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .back {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid #3a3d57;
    background: transparent;
    color: #c9cce6;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
  }
  header h1 {
    flex: 1;
    text-align: center;
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: .2px;
  }
  .gear {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid #3a3d57;
    background: transparent;
    color: #c9cce6;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
  }

  /* ---------- Voortgangsbalk ---------- */
  .progress-wrap {
    flex: 0 0 auto;
    padding: 0 18px 10px;
    display: flex;
    justify-content: center;
  }
  .progress-track {
    height: 9px;
    width: 50%;
    background: var(--track);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- Chat ---------- */
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 100%;
    animation: pop .25s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .row.ai { justify-content: flex-start; }
  .row.me { justify-content: flex-end; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex: 0 0 auto;
  }
  .avatar-robot {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex: 0 0 auto;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #0d0f1e;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px 12px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble-header {
    font-size: 11.5px;
    color: var(--label);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .ai .bubble {
    background: var(--ai-bubble);
    color: var(--ai-text);
    border-bottom-left-radius: 5px;
  }
  .me .bubble {
    background: var(--me-bubble);
    color: var(--me-text);
    border-bottom-right-radius: 5px;
  }
  .me .bubble .bubble-header { color: #9395aa; }

  .typing { display: flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #9a9db5;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

  /* ---------- Invoer ---------- */
  .composer {
    flex: 0 0 auto;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    background: transparent;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .composer input {
    flex: 1;
    background: #9E9FA6;
    border: none;
    border-radius: 99px;
    padding: 13px 18px;
    color: #1b1d2e;
    font-size: 15.5px;
    outline: none;
    caret-color: var(--accent);
  }
  .composer input::placeholder { color: #5a5b62; }
  .send {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    transition: transform .12s, opacity .2s;
    padding: 0;
  }
  .send:active { transform: scale(.9); }
  .send:disabled { opacity: .45; cursor: default; }

  /* ---------- Instellingen-scherm ---------- */
  .settings {
    position: absolute; inset: 0;
    background: var(--bg);
    z-index: 20;
    display: flex; flex-direction: column;
    padding: 18px;
    gap: 14px;
  }
  .settings-head {
    display: flex; align-items: center; justify-content: space-between;
  }
  .settings-head h2 { color: #fff; margin: 0; font-size: 18px; }
  .settings-head .close {
    background: transparent; border: none; color: #c9cce6;
    font-size: 26px; cursor: pointer; line-height: 1;
  }
  .settings label { color: #c9cce6; font-size: 13px; font-weight: 600; }
  .settings textarea {
    flex: 1;
    background: #1c1f38; border: 1px solid #2c2f4c; border-radius: 12px;
    padding: 14px; color: #eef0ff; font-size: 13px; line-height: 1.5;
    outline: none; resize: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .settings .hint { color: #6b6f8a; font-size: 12px; line-height: 1.4; margin: 0; }
  .settings-actions { display: flex; gap: 10px; }
  .settings-actions button {
    flex: 1; border: none; border-radius: 12px; padding: 14px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-reset { background: #1c1f38; color: #c9cce6; border: 1px solid #2c2f4c !important; }
  .hidden { display: none !important; }

  /* ---------- Guyiday stijl ---------- */
  #app.theme-gd {
    --bg: #1d1e1b;
    --ai-bubble: #ffffff;
    --ai-text: #1d1e1b;
    --me-bubble: #3d1a08;
    --me-text: #f5d5c5;
    --accent: #d6521e;
    --track: #3a2a22;
    --label: #8a7060;
    background: linear-gradient(180deg, #1d1e1b 0%, #111210 100%);
  }
  #app.theme-gd header { background: #1d1e1b; }
  #app.theme-gd .back,
  #app.theme-gd .gear { border-color: #3a2a22; color: #c4a99a; }
  #app.theme-gd .me .bubble .bubble-header { color: #b08070; }
  #app.theme-gd .settings { background: #1d1e1b; }
  #app.theme-gd .settings textarea,
  #app.theme-gd .toggle-row,
  #app.theme-gd .btn-reset { background: #2a1e18; border-color: #3a2a22 !important; }

  /* ---------- White Label stijl ---------- */
  #app.theme-wl {
    --bg: #DFE1E1;
    --ai-bubble: #F7F9FA;
    --ai-text: #1a2e24;
    --me-bubble: #86CDAC;
    --me-text: #0f2b1d;
    --accent: #52B788;
    --track: #B5CFBE;
    --label: #6a8a7a;
    background: linear-gradient(180deg, #DFE1E1 0%, #F7F9FA 100%);
  }
  #app.theme-wl header { background: #DFE1E1; }
  #app.theme-wl header h1 { color: #1a2e24; }
  #app.theme-wl .back,
  #app.theme-wl .gear { border-color: #B5CFBE; color: #3a5a4a; }
  #app.theme-wl .me .bubble .bubble-header { color: #3a6a52; }
  #app.theme-wl .settings { background: #DFE1E1; }
  #app.theme-wl .settings h2 { color: #1a2e24; }
  #app.theme-wl .settings label { color: #3a5a4a; }
  #app.theme-wl .settings .hint { color: #6a8a7a; }
  #app.theme-wl .toggle-row span { color: #3a5a4a; }
  #app.theme-wl .settings textarea { color: #1a2e24; }
  #app.theme-wl .settings textarea,
  #app.theme-wl .toggle-row,
  #app.theme-wl .btn-reset { background: #F0F2F2; border-color: #B5CFBE !important; }
  #app.theme-wl .composer input { background: #FBFCFD; }

  /* ---------- Stijl-kiezer ---------- */
  .theme-picker {
    display: flex;
    gap: 8px;
  }
  .theme-btn {
    flex: 1;
    border: 1.5px solid #2c2f4c;
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    background: #1c1f38;
    color: #c9cce6;
    transition: background .15s, color .15s, border-color .15s;
  }
  .theme-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #1c1f38; border: 1px solid #2c2f4c; border-radius: 12px;
    padding: 12px 16px;
  }
  .toggle-row span { color: #c9cce6; font-size: 14px; }
  .toggle { position: relative; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0;
    background: #3a3d57; border-radius: 99px; cursor: pointer;
    transition: background .2s;
  }
  .toggle-slider::before {
    content: ''; position: absolute;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; left: 3px; top: 3px;
    transition: transform .2s;
  }
  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

  /* ---------- Login ---------- */
  #loginScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 32px;
    z-index: 100;
  }
  #loginScreen h2 { color: #fff; margin: 0; font-size: 22px; font-weight: 700; }
  #loginScreen p { color: var(--label); margin: 0; font-size: 14px; text-align: center; }
  #loginScreen input {
    width: 100%; max-width: 320px;
    background: #1c1f38; border: 1px solid #2c2f4c;
    border-radius: 99px; padding: 13px 18px;
    color: #fff; font-size: 15.5px; outline: none;
    text-align: center; letter-spacing: 2px;
    caret-color: var(--accent);
  }
  #loginScreen input::placeholder { letter-spacing: 0; color: #6b6f8a; }
  #loginBtn {
    width: 100%; max-width: 320px;
    border: none; border-radius: 99px; padding: 14px;
    background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #loginError { color: var(--accent); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div id="loginScreen" class="hidden">
  <h2>AI-Buddy</h2>
  <p>Voer het wachtwoord in om verder te gaan</p>
  <input id="passwordInput" type="password" placeholder="Wachtwoord" autocomplete="off">
  <button id="loginBtn">Inloggen</button>
  <span id="loginError"></span>
</div>

<div id="app">

  <!-- Instellingen (verborgen tot je op het tandwiel klikt) -->
  <div class="settings hidden" id="settings">
    <div class="settings-head">
      <h2>Instellingen</h2>
      <button class="close" id="closeSettings" aria-label="Sluiten">×</button>
    </div>
    <div class="toggle-row">
      <span>API inschakelen</span>
      <label class="toggle">
        <input type="checkbox" id="apiToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Andere stijl</span>
      <label class="toggle">
        <input type="checkbox" id="themeToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="theme-picker hidden" id="themePicker">
      <button class="theme-btn" id="themeGD">GD</button>
      <button class="theme-btn" id="themeWL">WL</button>
    </div>
    <label for="promptArea">Prompt (instructies voor Sam)</label>
    <textarea id="promptArea" spellcheck="false"></textarea>
    <p class="hint">Tip: laat de regel over <b>[STEP:x]</b> onderaan staan — daarmee beweegt de voortgangsbalk mee.</p>
    <div class="settings-actions">
      <button class="btn-reset" id="resetPrompt">Standaard</button>
      <button class="btn-save" id="savePrompt">Opslaan &amp; nieuw gesprek</button>
    </div>
  </div>

  <header>
    <button class="back" aria-label="Terug">‹</button>
    <h1>AI-Buddy</h1>
    <button class="gear" id="openSettings" aria-label="Instellingen">⚙</button>
  </header>

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <input id="msgInput" type="text" placeholder="Typ een bericht…" autocomplete="off" disabled>
    <button class="send" id="sendBtn" aria-label="Verstuur" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
