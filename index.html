<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI-Buddy</title>
<style>
  /* ============================================================
     AI-BUDDY — HR check-in chat
     Kleuren uit Figma:
       BG          #111324
       AI-bubbel   #E6E6E6
       Jouw bubbel #212652
       Roze accent #FB2F74
     ============================================================ */
  :root {
    --bg: #111324;
    --ai-bubble: #E6E6E6;
    --ai-text: #1b1d2e;
    --me-bubble: #212652;
    --me-text: #eef0ff;
    --accent: #FB2F74;
    --track: #2a2d44;
    --label: #6b6f8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    max-width: 430px;
    margin: 0 auto;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---------- Header ---------- */
  header {
    flex: 0 0 auto;
    padding: 14px 18px 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .back {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid #3a3d57;
    background: transparent;
    color: #c9cce6;
    font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
  }
  header h1 {
    flex: 1;
    text-align: center;
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .2px;
  }
  .gear {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1.5px solid #3a3d57;
    background: transparent;
    color: #c9cce6;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
  }

  /* ---------- Voortgangsbalk ---------- */
  .progress-wrap {
    flex: 0 0 auto;
    padding: 0 18px 8px;
  }
  .progress-track {
    height: 7px;
    background: var(--track);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- Chat ---------- */
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 100%;
    animation: pop .25s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .row.ai { justify-content: flex-start; }
  .row.me { justify-content: flex-end; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex: 0 0 auto;
  }
  .bubble {
    max-width: 76%;
    padding: 12px 15px;
    border-radius: 18px;
    font-size: 15.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .ai .bubble {
    background: var(--ai-bubble);
    color: var(--ai-text);
    border-bottom-left-radius: 6px;
  }
  .me .bubble {
    background: var(--me-bubble);
    color: var(--me-text);
    border-bottom-right-radius: 6px;
  }
  .avatar.placeholder {
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }

  .typing { display: flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #9a9db5;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

  /* ---------- Invoer ---------- */
  .composer {
    flex: 0 0 auto;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(17,19,36,0) 0%, #181a2e 22%);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .composer input {
    flex: 1;
    background: #1c1f38;
    border: 1px solid #2c2f4c;
    border-radius: 99px;
    padding: 13px 18px;
    color: #fff;
    font-size: 15.5px;
    outline: none;
  }
  .composer input::placeholder { color: #6b6f8a; }
  .send {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 19px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    transition: transform .12s, opacity .2s;
  }
  .send:active { transform: scale(.9); }
  .send:disabled { opacity: .45; cursor: default; }

  /* ---------- Instellingen-scherm ---------- */
  .settings {
    position: absolute; inset: 0;
    background: var(--bg);
    z-index: 20;
    display: flex; flex-direction: column;
    padding: 18px;
    gap: 14px;
  }
  .settings-head {
    display: flex; align-items: center; justify-content: space-between;
  }
  .settings-head h2 { color: #fff; margin: 0; font-size: 18px; }
  .settings-head .close {
    background: transparent; border: none; color: #c9cce6;
    font-size: 26px; cursor: pointer; line-height: 1;
  }
  .settings label { color: #c9cce6; font-size: 13px; font-weight: 600; }
  .settings textarea {
    flex: 1;
    background: #1c1f38; border: 1px solid #2c2f4c; border-radius: 12px;
    padding: 14px; color: #eef0ff; font-size: 13px; line-height: 1.5;
    outline: none; resize: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .settings .hint { color: #6b6f8a; font-size: 12px; line-height: 1.4; margin: 0; }
  .settings-actions { display: flex; gap: 10px; }
  .settings-actions button {
    flex: 1; border: none; border-radius: 12px; padding: 14px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-reset { background: #1c1f38; color: #c9cce6; border: 1px solid #2c2f4c !important; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- Instellingen (verborgen tot je op het tandwiel klikt) -->
  <div class="settings hidden" id="settings">
    <div class="settings-head">
      <h2>Prompt aanpassen</h2>
      <button class="close" id="closeSettings" aria-label="Sluiten">×</button>
    </div>
    <label for="promptArea">Gem-prompt (instructies voor AI-Buddy)</label>
    <textarea id="promptArea" spellcheck="false"></textarea>
    <p class="hint">Tip: laat de regel over <b>[STEP:x]</b> onderaan staan — daarmee beweegt de voortgangsbalk mee. Wijzigingen worden in je browser bewaard en gelden bij een nieuw gesprek.</p>
    <div class="settings-actions">
      <button class="btn-reset" id="resetPrompt">Standaard</button>
      <button class="btn-save" id="savePrompt">Opslaan &amp; nieuw gesprek</button>
    </div>
  </div>

  <header>
    <button class="back" aria-label="Terug">‹</button>
    <h1>AI-Buddy</h1>
    <button class="gear" id="openSettings" aria-label="Instellingen">⚙</button>
  </header>

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <input id="msgInput" type="text" placeholder="Typ een bericht…" autocomplete="off" disabled>
    <button class="send" id="sendBtn" aria-label="Verstuur" disabled>➤</button>
  </div>

</div>

/* ============================================================
   2. STANDAARD SYSTEM PROMPT (jouw Gem-instructies)
   Dit is de fallback. Je kunt 'm in het instellingenscherm
   aanpassen; je versie wordt dan in je browser bewaard.
   ============================================================ */
const DEFAULT_PROMPT = `Rol & Persoonlijkheid
Je bent het informele HR-maatje van de Bazen. Je bent nuchter, direct en een ster in het herkennen van patronen. Je doel is om een dialoog te voeren die niet als 'werk' voelt, maar als een stap richting een betere sfeer.

Conversatie-Logica: De Clustering-Motor

HET GESPREKSPROTOCOL
1. De Opening (Het 'Nu' moment)
Begin het gesprek altijd zo:
"Hé! Alles goed met je? Even voordat we het gesprek induiken: alles is vertrouwelijk en je kunt stoppen wanneer je wilt.
Waar loop je op dit moment, vandaag of deze week, tegenaan in je werk of binnen het team?"

2. Fase 1: Verdieping van het 'Nu'
Vraag door op dit huidige punt. Gebruik open vragen (Hoe, wat, wanneer) om de impact helder te krijgen.

3. Fase 2: De Agentic Cluster (De 'Slimme' Move)
Zodra het huidige punt helder is en genoeg als goede input gezien wordt, dan mag je verder.

4. Fase 3: De Neutrale Stelling (Objectiveren)
Vertaal de hele bak aan informatie naar maximaal 2 krachtige, anonieme stellingen. Vermijd hier moeilijke termen en houd het luchtig.
Check: "Ik heb een samenvatting gemaakt van de belangrijkste thema's van je maand: [Stelling]. Slaat dit de spijker op zijn kop?"

5. De Peak-End (De Neuromarketing-afsluiter)
Forceer een positieve afsluiting voor de 'Peak-End-Rule':
"Laatste vraag: wat was deze maand echt een 'Bazen-moment'? Wat ging er zo goed dat je er trots op bent?"

6. Afronding
Eindig informeel: "Top, ik sla dit anoniem op. We gaan hiermee aan de slag tijdens de volgende sessie. Lekker gewerkt!"

ESCALATIE-PROTOCOL (Veiligheid)
Grensoverschrijdend gedrag: Bij meldingen van intimidatie, pesten of discriminatie stop je de vragenlijst direct.
Instructie: Zeg: "Dit klinkt als een situatie waar ik je als chatbot niet direct bij kan helpen. Ik adviseer je om dit te bespreken met Lars. Hij is hiervoor het aanspreekpunt."
Als Lars het probleem is: Als de gebruiker aangeeft dat Lars betrokken is, zeg dan: "Ik begrijp dat dit lastig is. In dat geval is het verstandig om hierover te praten met een andere collega die je vertrouwt of een externe vertrouwenspersoon."

BELANGRIJKE TECHNISCHE INSTRUCTIE (voor de app, niet zichtbaar voor gebruiker):
Het gesprek bestaat uit 6 stappen die overeenkomen met het protocol hierboven:
- Stap 1 = De Opening
- Stap 2 = Verdieping van het 'Nu'
- Stap 3 = De Agentic Cluster
- Stap 4 = De Neutrale Stelling / Objectiveren
- Stap 5 = De Peak-End vraag
- Stap 6 = De Afronding
Voeg AAN HET EINDE van ELK bericht dat je stuurt een marker toe in dit exacte formaat: [STEP:x] waarbij x het nummer is van de stap waar je NU in zit (1 t/m 6).
Schrijf NOOIT zelf "stap x van de 6" of iets dergelijks in je zichtbare tekst. Gebruik alleen de [STEP:x] marker. Verder hou je je gewoon aan je rol hierboven.`;

/* ============================================================
   3. STATE
   ============================================================ */
const STORAGE_KEY = "aibuddy_prompt";
let systemPrompt = DEFAULT_PROMPT;
let history = [];
let currentStep = 1;
const TOTAL_STEPS = 6;

const $ = (id) => document.getElementById(id);

/* prompt uit browseropslag halen (indien aanwezig) */
function loadPrompt() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && saved.trim()) systemPrompt = saved;
  } catch (e) { /* opslag niet beschikbaar — gebruik standaard */ }
  $("promptArea").value = systemPrompt;
}

/* ============================================================
   4. UI HELPERS
   ============================================================ */
function avatarEl(who) {
  const src = who === "ai" ? AVATAR_AI : AVATAR_ME;
  if (src && src.startsWith("data:")) {
    const img = document.createElement("img");
    img.className = "avatar"; img.src = src;
    img.alt = who === "ai" ? "AI-Buddy" : "Jij";
    return img;
  }
  const d = document.createElement("div");
  d.className = "avatar placeholder";
  d.textContent = who === "ai" ? "AI" : "Jij";
  return d;
}

function addBubble(text, who) {
  const row = document.createElement("div");
  row.className = "row " + who;
  const av = avatarEl(who);
  const bub = document.createElement("div");
  bub.className = "bubble"; bub.textContent = text;
  if (who === "ai") { row.appendChild(av); row.appendChild(bub); }
  else { row.appendChild(bub); row.appendChild(av); }
  $("chat").appendChild(row);
  scrollDown();
  return row;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "row ai"; row.id = "typingRow";
  row.appendChild(avatarEl("ai"));
  const bub = document.createElement("div");
  bub.className = "bubble";
  bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(bub);
  $("chat").appendChild(row);
  scrollDown();
}
function hideTyping() { const t = $("typingRow"); if (t) t.remove(); }

function scrollDown() {
  const c = $("chat");
  setTimeout(() => { c.scrollTop = c.scrollHeight; }, 30);
}

function updateProgress(step) {
  currentStep = Math.max(1, Math.min(TOTAL_STEPS, step));
  $("progressFill").style.width = (currentStep / TOTAL_STEPS) * 100 + "%";
}

function extractStep(text) {
  const m = text.match(/\[STEP:\s*(\d)\s*\]/i);
  if (m) updateProgress(parseInt(m[1], 10));
  return text.replace(/\[STEP:\s*\d\s*\]/ig, "").trim();
}

/* ============================================================
   5. BACKEND-AANROEP  (praat met /api/chat, niet met Gemini direct)
   ============================================================ */
async function sendToBackend(isOpening) {
  showTyping();
  $("sendBtn").disabled = true;
  $("msgInput").disabled = true;

  const contents = history.map(h => ({ role: h.role, parts: [{ text: h.text }] }));
  if (isOpening) {
    contents.push({ role: "user", parts: [{ text: "Start het gesprek volgens stap 1 (De Opening)." }] });
  }

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents, systemPrompt })
    });
    const data = await res.json();
    hideTyping();

    if (!res.ok) {
      addBubble("⚠️ Er ging iets mis:\n" + (data.error || ("Fout " + res.status)), "ai");
      reEnable();
      return;
    }

    let aiText = data.text || "Hmm, ik kreeg geen antwoord terug. Probeer het nog eens.";
    const clean = extractStep(aiText);
    history.push({ role: "model", text: aiText });
    addBubble(clean, "ai");
  } catch (err) {
    hideTyping();
    addBubble("⚠️ Geen verbinding met de server. Draait de app op Vercel?", "ai");
  }
  reEnable();
}

function reEnable() {
  $("msgInput").disabled = false;
  $("sendBtn").disabled = false;
  $("msgInput").focus();
}

/* ============================================================
   6. GESPREK STARTEN / VERSTUREN
   ============================================================ */
function startConversation() {
  $("chat").innerHTML = "";
  history = [];
  updateProgress(1);
  $("msgInput").disabled = false;
  $("sendBtn").disabled = false;
  sendToBackend(true);
}

function handleSend() {
  const input = $("msgInput");
  const text = input.value.trim();
  if (!text) return;
  addBubble(text, "me");
  history.push({ role: "user", text: text });
  input.value = "";
  sendToBackend(false);
}

$("sendBtn").addEventListener("click", handleSend);
$("msgInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); handleSend(); }
});

/* ============================================================
   7. INSTELLINGEN
   ============================================================ */
$("openSettings").addEventListener("click", () => {
  $("promptArea").value = systemPrompt;
  $("settings").classList.remove("hidden");
});
$("closeSettings").addEventListener("click", () => {
  $("settings").classList.add("hidden");
});
$("savePrompt").addEventListener("click", () => {
  const val = $("promptArea").value.trim();
  if (!val) return;
  systemPrompt = val;
  try { localStorage.setItem(STORAGE_KEY, val); } catch (e) {}
  $("settings").classList.add("hidden");
  startConversation();
});
$("resetPrompt").addEventListener("click", () => {
  systemPrompt = DEFAULT_PROMPT;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  $("promptArea").value = DEFAULT_PROMPT;
});

/* ============================================================
   8. INIT
   ============================================================ */
loadPrompt();
startConversation();
</script>
